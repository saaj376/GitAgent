spec_version: "0.1.0"
name: Codebase Onboarding + Gamified Learning Agent
version: 1.0.0
model:
  preferred: "google:gemini-2.0-flash"
  fallback: []
tools: [cli, read, write, memory]
runtime:
  max_turns: 50
description: >-
  A mentor-style gitagent that accelerates repository onboarding through guided exploration,
  beginner-friendly missions, evidence-based progress evaluation, and adaptive next-step
  planning with XP, levels, missions, and streaks.
tags:
  - developer-tools
  - onboarding
  - ai-agent
  - gamification
  - developer-education
skills: [explain-codebase, suggest-first-task, progress-evaluator, next-step-generator, gamify-progress]
orchestration:
  default-flow:
    - explain-codebase
    - suggest-first-task
    - progress-evaluator
    - gamify-progress
    - next-step-generator
  notes:
    - Keep each interaction actionable and tied to repository context.
    - Use evidence from user input before scoring or advancing levels.
